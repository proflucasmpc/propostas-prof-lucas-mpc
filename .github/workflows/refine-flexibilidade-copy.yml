name: Ajustar copy de flexibilidade

on:
  push:
    paths:
      - '.github/workflows/refine-flexibilidade-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remover expressão comece pequeno
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Comece pequeno e amplie a parceria conforme a demanda.','Adapte a parceria à demanda da sua operação.')
          s=s.replace('A parceria pode começar pequena e crescer junto com a demanda da sua turma.','Escolha a solução adequada à demanda do seu curso e combine formatos quando fizer sentido.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajusta copy de flexibilidade da proposta"
          git push origin main
