name: Atualizar VSL inicial para versão 2

on:
  push:
    paths:
      - '.github/workflows/localize-video-proposta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vsl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validar nova VSL
        run: |
          test -f VSL_Prof_Lucas_MPC_45s_v2.mp4
          test -f video-proposta-web.mp4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Criar nova capa da VSL
        run: |
          ffmpeg -y -ss 00:00:02 -i VSL_Prof_Lucas_MPC_45s_v2.mp4 -frames:v 1 -q:v 3 vsl-45s-poster-v2.jpg

      - name: Trocar somente o primeiro vídeo da página
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_src = 'src="VSL_Prof_Lucas_MPC_45s.mp4"'
          new_src = 'src="VSL_Prof_Lucas_MPC_45s_v2.mp4"'
          old_poster = 'poster="vsl-45s-poster.jpg"'
          new_poster = 'poster="vsl-45s-poster-v2.jpg"'

          if new_src not in s:
              if old_src not in s:
                  raise RuntimeError('Não encontrei a VSL antiga no primeiro player.')
              s = s.replace(old_src, new_src, 1)

          if new_poster not in s:
              if old_poster not in s:
                  raise RuntimeError('Não encontrei a capa antiga da VSL.')
              s = s.replace(old_poster, new_poster, 1)

          p.write_text(s, encoding='utf-8')
          print('Primeira VSL atualizada para a versão 2. Vídeo longo mantido intacto.')
          PY

      - name: Commitar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vsl-45s-poster-v2.jpg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Atualiza VSL inicial para versão 2"
          git push origin main
